# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: technicolabs/simba-adventures
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/3f7b0bd1-5ac1-4263-906e-9502144a6488/pkce
  auth_token_endpoint: /sites/3f7b0bd1-5ac1-4263-906e-9502144a6488/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://technicolabs.github.io

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - name: "tours"
        label: "Safari Tours Data"
        file: "tours.json"
        format: "json"
        fields:
          - label: "Tours List"
            name: "tours"
            widget: "list"
            summary: "{{fields.title}} - {{fields.location}}"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Tour Image", name: "image", widget: "image" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Route", name: "route", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Duration", name: "duration", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Badge", name: "badge", widget: "string", required: false }
              - { label: "Categories", name: "categories", widget: "list", field: { label: "Category", name: "category", widget: "string" } }
              - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
              - { label: "Accommodation", name: "accommodation", widget: "string" }
              - { label: "Rating", name: "rating", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
              - { label: "Reviews Count", name: "reviews", widget: "string" }

      - name: "gallery"
        label: "Gallery Page Data"
        file: "gallery.json"
        format: "json"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - label: "Gallery Photos"
            name: "gallery"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Kenya", "Tanzania", "Botswana"] }
              - { label: "Height", name: "height", widget: "select", options: ["240px", "260px", "280px", "300px", "320px", "340px"] }
              - { label: "Alt Text", name: "alt", widget: "string" }
