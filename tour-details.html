```html
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tour Details — Simba Adventures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <link rel="stylesheet" href="styles.css">

</head>


<body>


  <!-- ================= HEADER ================= -->

  <header class="site-header">

    <div class="wrap">

      <a href="index.html" class="brand">

        <i class="fa-solid fa-paw"></i>

        Simba Adventures

      </a>


      <ul class="nav-menu nav-menu-links">

        <li>
          <a href="index.html">
            Home
          </a>
        </li>

        <li>
          <a href="tour.html">
            Tours &amp; Safaris
          </a>
        </li>

        <li>
          <a href="about-us.html">
            About Us
          </a>
        </li>

        <li>
          <a href="gallery.html">
            Gallery
          </a>
        </li>

        <li>
          <a href="contact-us.html">
            Contact
          </a>
        </li>

      </ul>


      <div class="nav-right">

        <a
          href="plan-my-safari.html"
          class="btn btn-gold btn-sm"
        >
          Plan My Safari
        </a>

      </div>

    </div>

  </header>



  <!-- ================= TOUR DETAILS ================= -->

  <main>

    <section class="section">

      <div class="wrap">

        <div id="tour-details">

          <p>
            Loading tour...
          </p>

        </div>

      </div>

    </section>

  </main>



  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /*
      GET TOUR NAME FROM URL
    */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );


    const selectedTour =
      urlParams.get('tour');


    /*
      TOUR DETAILS CONTAINER
    */

    const tourDetails =
      document.getElementById(
        'tour-details'
      );


    /*
      CHECK IF TOUR EXISTS IN URL
    */

    if (!selectedTour) {

      tourDetails.innerHTML = `
        <h2>Tour Not Found</h2>

        <p>
          No tour was selected.
        </p>

        <a
          href="tour.html"
          class="btn btn-gold"
        >
          View All Tours
        </a>
      `;

    } else {


      /*
        LOAD TOURS FROM CMS JSON
      */

      fetch('tours.json')

        .then(function(response) {

          if (!response.ok) {

            throw new Error(
              'Could not load tours.json'
            );

          }

          return response.json();

        })


        .then(function(data) {


          /*
            SUPPORT CMS STRUCTURE:

            {
              "tours": [...]
            }

            ALSO SUPPORT OLD ARRAY FORMAT
          */

          const tours =
            Array.isArray(data)
              ? data
              : data.tours || [];


          /*
            FIND SELECTED TOUR
          */

          const tour =
            tours.find(function(item) {

              return item.title === selectedTour;

            });


          /*
            TOUR NOT FOUND
          */

          if (!tour) {

            tourDetails.innerHTML = `

              <h2>Tour Not Found</h2>

              <p>
                We could not find this safari.
              </p>

              <a
                href="tour.html"
                class="btn btn-gold"
              >
                View All Tours
              </a>

            `;

            return;

          }


          /*
            SAFE TAGS ARRAY
          */

          const tags =
            Array.isArray(tour.tags)
              ? tour.tags
              : [];


          /*
            SHOW TOUR
          */

          tourDetails.innerHTML = `

            <div>

              <img
                src="${tour.image}"
                alt="${tour.title}"
                style="
                  width:100%;
                  max-height:500px;
                  object-fit:cover;
                  border-radius:12px;
                "
              >

            </div>


            <div
              style="
                max-width:850px;
                margin:35px auto 0;
              "
            >

              <span class="eyebrow">
                ${tour.location}
              </span>


              <h1>
                ${tour.title}
              </h1>


              <p
                style="
                  font-size:18px;
                  line-height:1.7;
                  color:var(--ink-faint);
                "
              >
                ${tour.description}
              </p>


              <div
                style="
                  display:grid;
                  grid-template-columns:
                    repeat(auto-fit,minmax(180px,1fr));
                  gap:15px;
                  margin:30px 0;
                "
              >

                <div class="info-card-light">

                  <strong>
                    Duration
                  </strong>

                  <p>
                    ${tour.duration}
                  </p>

                </div>


                <div class="info-card-light">

                  <strong>
                    Starting Price
                  </strong>

                  <p>
                    $${tour.price}
                  </p>

                </div>


                <div class="info-card-light">

                  <strong>
                    Accommodation
                  </strong>

                  <p>
                    ${tour.accommodation}
                  </p>

                </div>


                <div class="info-card-light">

                  <strong>
                    Rating
                  </strong>

                  <p>
                    ⭐ ${tour.rating}
                    (${tour.reviews} reviews)
                  </p>

                </div>

              </div>


              <div
                style="
                  margin-bottom:25px;
                "
              >

                <strong>
                  Route
                </strong>

                <p>
                  ${tour.route}
                </p>

              </div>


              <div
                style="
                  display:flex;
                  flex-wrap:wrap;
                  gap:8px;
                  margin-bottom:30px;
                "
              >

                ${tags.map(function(tag) {

                  return `
                    <span
                      style="
                        padding:7px 12px;
                        border-radius:20px;
                        background:#f2eee5;
                        font-size:13px;
                      "
                    >
                      ${tag}
                    </span>
                  `;

                }).join('')}

              </div>


              <a
                href="plan-my-safari.html?tour=${encodeURIComponent(tour.title)}"
                class="btn btn-gold"
              >
                Book This Safari &rarr;
              </a>


              <a
                href="tour.html"
                class="btn btn-outline"
                style="margin-left:10px;"
              >
                Back to Tours
              </a>

            </div>

          `;


          /*
            CHANGE PAGE TITLE
          */

          document.title =
            tour.title +
            ' — Simba Adventures';

        })


        .catch(function(error) {

          console.error(
            'Tour loading error:',
            error
          );


          tourDetails.innerHTML = `

            <h2>
              Something went wrong
            </h2>

            <p>
              We couldn't load the tour details.
            </p>

            <a
              href="tour.html"
              class="btn btn-gold"
            >
              Back to Tours
            </a>

          `;

        });

    }

  </script>


</body>
</html>
```
