<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Safari Details | Simba Adventures</title>

  <meta
    name="description"
    content="Explore detailed safari itineraries with Simba Adventures Tanzania."
  >

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #f8f6f0;
      color: #202820;
      line-height: 1.7;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    /* HEADER */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e8e5dc;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      font-weight: 700;
      color: #263a28;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #b07a32;
    }

    .nav-button {
      background: #b07a32;
      color: white !important;
      padding: 11px 18px;
      border-radius: 5px;
    }

    /* HERO */

    .tour-hero {
      position: relative;
      min-height: 520px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: #27372a;
    }

    .tour-hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tour-hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, 0.78),
          rgba(0, 0, 0, 0.22) 65%,
          rgba(0, 0, 0, 0.15)
        );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      color: white;
      padding: 80px 0 55px;
      width: 100%;
    }

    .breadcrumb {
      font-size: 13px;
      margin-bottom: 18px;
      opacity: 0.85;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .hero-badge {
      display: inline-block;
      background: #b07a32;
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    #tourHeroTitle {
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.05;
      max-width: 850px;
      margin-bottom: 18px;
    }

    .hero-location {
      font-size: 16px;
      opacity: 0.92;
    }

    /* MAIN */

    main {
      padding: 70px 0;
    }

    .tour-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 55px;
      align-items: start;
    }

    .main-content {
      min-width: 0;
    }

    /* INFO BAR */

    .tour-info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid #e2ded3;
      background: white;
      margin-bottom: 50px;
      border-radius: 8px;
      overflow: hidden;
    }

    .info-item {
      padding: 23px;
      border-right: 1px solid #e2ded3;
      border-bottom: 1px solid #e2ded3;
    }

    .info-item:nth-child(2n) {
      border-right: 0;
    }

    .info-item:nth-last-child(-n+2) {
      border-bottom: 0;
    }

    .info-label {
      display: block;
      color: #7c7c72;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 700;
      color: #263a28;
    }

    .price-value {
      color: #b07a32;
    }

    /* DESCRIPTION */

    .section-title {
      font-family: "Playfair Display", serif;
      font-size: 34px;
      color: #263a28;
      margin-bottom: 25px;
    }

    .detailed-description {
      background: white;
      padding: 38px;
      border: 1px solid #e5e1d8;
      border-radius: 8px;
    }

    .detailed-description h2 {
      font-family: "Playfair Display", serif;
      font-size: 29px;
      color: #263a28;
      margin: 35px 0 20px;
    }

    .detailed-description h2:first-child {
      margin-top: 0;
    }

    .detailed-description h3 {
      font-size: 21px;
      color: #344d38;
      margin: 30px 0 12px;
    }

    .detailed-description p {
      margin-bottom: 18px;
      color: #4f554d;
      font-size: 16px;
    }

    .detailed-description strong {
      color: #263a28;
      font-weight: 700;
    }

    .detailed-description ul {
      padding-left: 25px;
      margin: 10px 0 20px;
    }

    .detailed-description li {
      margin-bottom: 8px;
    }

    /* SIDEBAR */

    .sidebar {
      position: sticky;
      top: 105px;
    }

    .booking-card {
      background: white;
      border: 1px solid #e2ded3;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(30, 40, 30, 0.06);
    }

    .booking-card h3 {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      color: #263a28;
      margin-bottom: 18px;
    }

    .booking-price {
      font-size: 31px;
      color: #b07a32;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .booking-small {
      font-size: 13px;
      color: #77786f;
      margin-bottom: 25px;
    }

    .booking-button {
      display: block;
      width: 100%;
      background: #b07a32;
      color: white;
      text-align: center;
      padding: 14px 20px;
      border-radius: 5px;
      font-weight: 700;
      margin-bottom: 11px;
      transition: 0.2s;
    }

    .booking-button:hover {
      background: #8e6025;
    }

    .booking-button.secondary {
      background: transparent;
      border: 1px solid #b07a32;
      color: #9b6827;
    }

    .booking-button.secondary:hover {
      background: #faf3e7;
    }

    /* ROUTE */

    .route-box {
      margin-top: 35px;
      padding: 24px;
      background: #f2eee4;
      border-radius: 8px;
    }

    .route-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c776b;
      margin-bottom: 7px;
    }

    .route-text {
      font-size: 15px;
      font-weight: 600;
      color: #354235;
    }

    /* TAGS */

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .tag {
      background: #edf0e9;
      color: #3d513e;
      padding: 7px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
    }

    /* LOADING */

    .loading {
      padding: 100px 20px;
      text-align: center;
      font-size: 18px;
      color: #777;
    }

    .error-box {
      max-width: 750px;
      margin: 80px auto;
      background: white;
      border: 1px solid #e3ded4;
      padding: 45px;
      border-radius: 8px;
      text-align: center;
    }

    .error-box h2 {
      font-family: "Playfair Display", serif;
      color: #263a28;
      margin-bottom: 15px;
    }

    .error-box p {
      color: #666;
      margin-bottom: 25px;
    }

    /* FOOTER */

    footer {
      background: #263a28;
      color: white;
      padding: 50px 0;
      margin-top: 30px;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      flex-wrap: wrap;
    }

    .footer-brand {
      font-family: "Playfair Display", serif;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .footer-text {
      max-width: 450px;
      opacity: 0.78;
      font-size: 14px;
    }

    .footer-links {
      display: flex;
      gap: 25px;
      font-size: 14px;
    }

    .footer-links a:hover {
      color: #e3b76d;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .tour-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .tour-info-grid {
        grid-template-columns: 1fr;
      }

      .info-item,
      .info-item:nth-child(2n) {
        border-right: 0;
      }

      .info-item:nth-last-child(-n+2) {
        border-bottom: 1px solid #e2ded3;
      }

      .info-item:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(100% - 28px, 1180px);
      }

      .nav {
        min-height: 68px;
      }

      .nav-links {
        gap: 12px;
        font-size: 12px;
      }

      .nav-links a:not(.nav-button) {
        display: none;
      }

      .tour-hero {
        min-height: 430px;
      }

      .hero-content {
        padding: 55px 0 35px;
      }

      .detailed-description {
        padding: 24px;
      }

      .detailed-description h2 {
        font-size: 25px;
      }

      .detailed-description h3 {
        font-size: 19px;
      }

      main {
        padding: 45px 0;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="container nav">

      <a href="index.html" class="logo">
        Simba Adventures
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="tours.html">Safari Tours</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>

        <a href="contact.html" class="nav-button">

        </a>
      </nav>

    </div>
  </header>


  <!-- HERO -->
  <section class="tour-hero">

    <img
      id="tourHeroImage"
      class="tour-hero-image"
      src=""
      alt=""
    >

    <div class="tour-hero-overlay"></div>

    <div class="container hero-content">

      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span> / </span>

        <span>Tour Details</span>

  <!-- MAIN -->
  <main>

    <div class="container">

      <div id="tour-details">

        <div class="loading">
          Loading safari details...
        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>

    <div class="container footer-content">

      <div>
        <div class="footer-brand">
          Simba Adventures
        </div>

        <div class="footer-text">
          Locally owned Tanzanian safari experiences across Tanzania's
          most spectacular landscapes.
        </div>
      </div>

      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="tours.html">Tours</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>

    </div>

  </footer>


  <script>

    /*
      ==========================================================
      SIMBA ADVENTURES - DYNAMIC TOUR DETAILS
      ==========================================================

      This page works with ALL tours inside tours.json.

      It does NOT contain any hard-coded tour.

      Example:

      tour-details.html?tour=The%20Serengeti%20Symphony

      or

      tour-details.html?tour=Kilimanjaro%20Expedition

      The script finds the matching title inside tours.json
      and automatically displays its information.
      ==========================================================
    */


    const params = new URLSearchParams(window.location.search);

    const selectedTourTitle = params.get("tour");


    /*
      Escape HTML so CMS content does not accidentally
      become executable HTML.
    */

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      Convert the detailedDescription text into
      properly formatted HTML.

      Supports:

      # Heading
      ## Heading
      ### Heading

      **bold**

      *italic*

      - bullet

      blank lines = paragraphs
    */

    function markdownToHtml(text) {

      if (!text) {
        return "";
      }

      let source = String(text)
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .trim();


      const lines = source.split("\n");

      let html = "";

      let paragraph = [];

      let inList = false;


      function closeParagraph() {

        if (paragraph.length === 0) {
          return;
        }

        let content = paragraph.join(" ").trim();

        content = formatInlineMarkdown(content);

        if (content) {
          html += "<p>" + content + "</p>";
        }

        paragraph = [];
      }


      function closeList() {

        if (inList) {
          html += "</ul>";
          inList = false;
        }

      }


      function formatInlineMarkdown(value) {

        let result = escapeHtml(value);

        /*
          Bold
        */
        result = result.replace(
          /\*\*(.*?)\*\*/g,
          "<strong>$1</strong>"
        );

        /*
          Italic
        */
        result = result.replace(
          /\*(.*?)\*/g,
          "<em>$1</em>"
        );

        return result;

      }


      lines.forEach(function(line) {

        const trimmed = line.trim();


        /*
          Empty line
        */

        if (!trimmed) {

          closeParagraph();

          closeList();

          return;
        }


        /*
          H3
        */

        if (trimmed.startsWith("### ")) {

          closeParagraph();

          closeList();

          html +=
            "<h3>" +
            formatInlineMarkdown(trimmed.substring(4)) +
            "</h3>";

          return;
        }


        /*
          H2
        */

        if (trimmed.startsWith("## ")) {

          closeParagraph();

          closeList();

          html +=
            "<h2>" +
            formatInlineMarkdown(trimmed.substring(3)) +
            "</h2>";

          return;
        }


        /*
          H1
        */

        if (trimmed.startsWith("# ")) {

          closeParagraph();

          closeList();

          html +=
            "<h2>" +
            formatInlineMarkdown(trimmed.substring(2)) +
            "</h2>";

          return;
        }


        /*
          Bullet list
        */

        if (
          trimmed.startsWith("- ") ||
          trimmed.startsWith("* ")
        ) {

          closeParagraph();

          if (!inList) {

            html += "<ul>";

            inList = true;
          }

          html +=
            "<li>" +
            formatInlineMarkdown(trimmed.substring(2)) +
            "</li>";

          return;
        }


        /*
          Normal text
        */

        closeList();

        paragraph.push(trimmed);

      });


      closeParagraph();

      closeList();


      return html;

    }


    /*
      Find a tour.

      Exact match is attempted first.

      Then a case-insensitive match.

      Then a decoded/trimmed match.
    */

    function findTour(tours, requestedTitle) {

      if (!Array.isArray(tours) || !requestedTitle) {
        return null;
      }


      /*
        Exact match
      */

      let tour = tours.find(function(item) {

        return String(item.title || "").trim() ===
          String(requestedTitle).trim();

      });


      if (tour) {
        return tour;
      }


      /*
        Case-insensitive match
      */

      const normalizedRequested =
        String(requestedTitle)
          .trim()
          .toLowerCase();


      tour = tours.find(function(item) {

        return String(item.title || "")
          .trim()
          .toLowerCase() === normalizedRequested;

      });


      return tour || null;

    }


    /*
      Load tours.json.
    */

    async function loadTours() {

      try {

        const response = await fetch(
          "./tours.json?v=" + Date.now(),
          {
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            "Could not load tours.json. HTTP " +
            response.status
          );

        }


        const data = await response.json();


        /*
          Supports:

          {
            "tours": [...]
          }

          and also:

          [...]
        */

        if (Array.isArray(data)) {
          return data;
        }


        if (data && Array.isArray(data.tours)) {
          return data.tours;
        }


        throw new Error(
          "tours.json does not contain a valid tours array."
        );

      }

      catch (error) {

        console.error(
          "Tour data loading error:",
          error
        );

        throw error;

      }

    }


    /*
      Create a tag element.
    */

    function createTags(tags) {

      if (!Array.isArray(tags) || tags.length === 0) {
        return "";
      }


      return tags.map(function(tag) {

        return (
          '<span class="tag">' +
          escapeHtml(tag) +
          "</span>"
        );

      }).join("");

    }


    /*
      Render the complete tour.
    */

    function renderTour(tour) {

      /*
        HERO
      */

      const heroImage =
        document.getElementById("tourHeroImage");

      const heroTitle =
        document.getElementById("tourHeroTitle");

      const heroLocation =
        document.getElementById("tourHeroLocation");

      const heroBadge =
        document.getElementById("tourHeroBadge");


      heroTitle.textContent =
        tour.title || "Safari Experience";


      heroLocation.textContent =
        tour.location || "";


      if (tour.image) {

        heroImage.src = tour.image;

        heroImage.alt =
          tour.title || "Simba Adventures Safari";

      }


      if (tour.badge) {

        heroBadge.textContent = tour.badge;

        heroBadge.style.display = "inline-block";

      }


      document.title =
        (tour.title || "Safari Details") +
        " | Simba Adventures";


      /*
        DESCRIPTION
      */

      const detailedText =
        tour.detailedDescription ||
        tour.detailed_description ||
        tour.longDescription ||
        tour.long_description ||
        tour.details ||
        tour.fullDescription ||
        tour.full_description ||
        tour.content ||
        tour.description ||
        "";


      const detailedHTML =
        markdownToHtml(detailedText);


      /*
        INFO
      */

      const detailsContainer =
        document.getElementById("tour-details");


      detailsContainer.innerHTML = `

        <div class="tour-layout">

          <div class="main-content">

            <div class="tour-info-grid">

              <div class="info-item">
                <span class="info-label">
                  Duration
                </span>

                <span class="info-value">
                  ${escapeHtml(tour.duration || "—")}
                </span>
              </div>


              <div class="info-item">
                <span class="info-label">
                  Starting Price
                </span>

                <span class="info-value price-value">
                  $${escapeHtml(tour.price || "—")}
                  <small style="font-size:11px;">
                    per person
                  </small>
                </span>
              </div>


              <div class="info-item">
                <span class="info-label">
                  Accommodation
                </span>

                <span class="info-value">
                  ${escapeHtml(tour.accommodation || "—")}
                </span>
              </div>


              <div class="info-item">
                <span class="info-label">
                  Guest Rating
                </span>

                <span class="info-value">
                  ★ ${escapeHtml(tour.rating || "—")}
                  ${tour.reviews
                    ? "(" + escapeHtml(tour.reviews) + " reviews)"
                    : ""
                  }
                </span>
              </div>

            </div>


            <section>

              <h2 class="section-title">
                About This Safari
              </h2>


              <div class="detailed-description">

                ${
                  detailedHTML ||
                  "<p>Detailed information for this safari is currently being prepared.</p>"
                }

              </div>

            </section>


            ${
              tour.route
              ? `
                <div class="route-box">

                  <div class="route-label">
                    Safari Route
                  </div>

                  <div class="route-text">
                    ${escapeHtml(tour.route)}
                  </div>

                </div>
              `
              : ""
            }


            ${
              Array.isArray(tour.tags) &&
              tour.tags.length
              ? `
                <div class="tags">
                  ${createTags(tour.tags)}
                </div>
              `
              : ""
            }

          </div>


          <aside class="sidebar">

            <div class="booking-card">

              <h3>
                Plan This Safari
              </h3>


              <div class="booking-price">
                $${escapeHtml(tour.price || "—")}
              </div>


              <div class="booking-small">
                Starting price per person
              </div>


              <a
                class="booking-button"
                href="contact.html"
              >
                Enquire About This Safari
              </a>


              <a
                class="booking-button secondary"
                href="tours.html"
              >
                View All Safaris
              </a>

            </div>

          </aside>

        </div>

      `;

    }


    /*
      Show an error page.
    */

    function showError(title, message) {

      document.getElementById("tour-details").innerHTML = `

        <div class="error-box">

          <h2>
            ${escapeHtml(title)}
          </h2>

          <p>
            ${escapeHtml(message)}
          </p>

          <a
            href="tours.html"
            class="booking-button"
            style="max-width:250px;margin:0 auto;"
          >
            View All Safaris
          </a>

        </div>

      `;

    }


    /*
      START
    */

    async function initTourPage() {

      if (!selectedTourTitle) {

        showError(
          "Safari Not Found",
          "No safari was selected. Please return to the safari tours page and choose a tour."
        );

        return;
      }


      try {

        const tours =
          await loadTours();


        console.log(
          "Loaded tours:",
          tours
        );


        console.log(
          "Requested tour:",
          selectedTourTitle
        );


        const tour =
          findTour(
            tours,
            selectedTourTitle
          );


        if (!tour) {

          console.error(
            "Available tour titles:",
            tours.map(function(item) {
              return item.title;
            })
          );


          showError(
            "Safari Not Found",
            "The selected safari could not be found in tours.json."
          );

          return;
        }


        console.log(
          "Selected tour data:",
          tour
        );


        renderTour(tour);

      }

      catch (error) {

        console.error(error);

        showError(
          "Unable to Load Safari",
          "The safari information could not be loaded. Please make sure tours.json is uploaded in the same folder as this page."
        );

      }

    }


    initTourPage();

  </script>

</body>
</html>
